<div class="col-lg-4 col-md-6 mb-4 d-flex">
  <div class="wow animated fadeIn w-100" data-wow-delay=".15s">
  <a href="{{ project_url }}" class="project card text-themed" {%- if external and site.open_new_tab -%} target="_blank" {%- endif -%}>
    {%- if project_img -%}
    <div class="img-wrapper">
      <img id="{{ project_id }}-img" class="card-img-top" src="{{ project_img }}" alt="{{ project_name }}" />
      {%- if project.award -%}
      <span class="award-badge">{{ project.award }}</span>
      {%- endif -%}
    </div>
    {%- endif -%}
    <div class="card-body">
      <h5 id="{{ project_id }}-name" class="card-title">
          {%- if project_type == "remote" -%}
          <i class="fab fa-github" data-toggle="tooltip" data-placement="bottom" data-delay="250" title="GitHub Repository"></i> |&nbsp;
          {%- endif -%}
        {{ project_name }}
      </h5>
      <div class="desc-container">
        <p id="{{ project_id }}-desc" class="card-text desc-text">{{ project_desc }}</p>
      </div>
      <p id="{{ project_id }}-tools" class="card-text">
        {%- for tool in project_tools -%}
        <span class="badge badge-pill text-primary border border-primary ml-1">{{ tool }}</span>
        {%- endfor -%}
      </p>
    </div>
  </a>
</div>
</div>
