<!-- for tags-->
<script>
    document.addEventListener('DOMContentLoaded', function () {
      // 1. 태그 버튼 클릭 시 프로젝트 필터링
      document.querySelectorAll('.tag-btn').forEach(button => {
        button.addEventListener('click', () => {
          const selectedTag = button.getAttribute('data-tag').toLowerCase();
  
          // 버튼 active 클래스 설정
          document.querySelectorAll('.tag-btn').forEach(btn => btn.classList.remove('active'));
          button.classList.add('active');
  
          // 카드 필터링
          document.querySelectorAll('.project.card').forEach(card => {
            const badges = Array.from(card.querySelectorAll('.badge')).map(el => el.textContent.trim().toLowerCase());
            if (selectedTag === 'all' || badges.includes(selectedTag)) {
              card.classList.remove('d-none');
            } else {
              card.classList.add('d-none');
            }
          });
        });
      });
  
      // 2. 태그 색상 매핑
      const tagColors = {
        javascript: 'warning',
        css: 'primary',
        html: 'danger',
        react: 'success',
        android: 'success',
        nothing: 'secondary',
        important: 'danger'
      };
  
      document.querySelectorAll('.tag-btn').forEach((btn) => {
        const tag = btn.dataset.tag.toLowerCase();
        const color = tagColors[tag];
        if (color) {
          btn.classList.remove('btn-outline-primary');
          btn.classList.add(`btn-outline-${color}`);
        }
      });
    });
  </script>
